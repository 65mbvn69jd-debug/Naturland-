<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Zembilden İşletme V18</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#111827}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:11px 14px;background:#111827;color:white}.login{min-height:100vh;display:grid;place-items:center;background:#111827;padding:20px}.card,.panel,.stat{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0001}.card{width:min(430px,100%)}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field select,input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px}.err{color:#dc2626;margin-top:10px}.app{display:none}.top{background:#111827;color:#fff;padding:15px;position:sticky;top:0;z-index:3}.toprow{display:flex;justify-content:space-between}.nav{display:flex;gap:7px;overflow:auto;margin-top:10px}.nav button{background:#374151;white-space:nowrap}.nav .active{background:#fff;color:#111827}main{max-width:1050px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat b{display:block;font-size:23px;margin-top:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.hidden{display:none!important}.success{background:#15803d}.danger{background:#dc2626}.muted{color:#6b7280}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}</style></head><body>
<div id="login" class="login"><div class="card"><h2>🔐 Zembilden İşletme</h2><p class="muted">Yönetici girişi</p><div class="field"><label>Kullanıcı adı</label><input id="u" value="admin"></div><div class="field"><label>Şifre</label><input id="p" type="password" value="1234"></div><button style="width:100%" onclick="login()">Giriş Yap</button><div id="e" class="err"></div></div></div>
<div id="app" class="app"><header class="top"><div class="toprow"><b>🛒 Zembilden İşletme V18</b><button onclick="logout()">Çıkış</button></div><div class="nav"><button class="active" onclick="tab('home',this)">Ana Sayfa</button><button onclick="tab('sale',this)">Satış</button><button onclick="tab('stock',this)">Stok</button><button onclick="tab('cash',this)">Kasa</button><button onclick="tab('car',this)">Cari</button><button onclick="tab('staff',this)">Personel</button></div></header><main>
<section id="home"><h2>Genel Bakış</h2><div class="grid"><div class="stat">Ciro<b id="ciro">₺0</b></div><div class="stat">Gider<b id="gider">₺0</b></div><div class="stat">Kâr<b id="kar">₺0</b></div><div class="stat">Kasa<b id="kasa">₺0</b></div><div class="stat">Stok çeşidi<b id="say">0</b></div></div></section>
<section id="sale" class="hidden"><h2>Satış</h2><div class="panel"><div class="row"><select id="sp"></select><input id="sq" type="number" min="1" value="1"></div><br><button class="success" onclick="sell()">Satışı Kaydet</button></div><div class="panel table"><table><thead><tr><th>Tarih</th><th>Ürün</th><th>Adet</th><th>Tutar</th><th></th></tr></thead><tbody id="st"></tbody></table></div></section>
<section id="stock" class="hidden"><h2>Stok</h2><div class="panel"><div class="row"><input id="pn" placeholder="Ürün"><input id="pb" type="number" placeholder="Alış"><input id="ps" type="number" placeholder="Satış"><input id="pq" type="number" placeholder="Adet"></div><br><button onclick="add()">Ürün Ekle</button></div><div class="panel table"><table><thead><tr><th>Ürün</th><th>Stok</th><th>Alış</th><th>Satış</th></tr></thead><tbody id="pt"></tbody></table></div></section>
<section id="cash" class="hidden"><h2>Kasa</h2><div class="panel"><div class="row"><select id="ct"><option value="in">Gelir</option><option value="out">Gider</option></select><input id="cn" placeholder="Açıklama"><input id="ca" type="number" placeholder="Tutar"></div><br><button onclick="cashop()">Kaydet</button></div><div class="panel table"><table><tbody id="kt"></tbody></table></div></section>
<section id="car" class="hidden"><h2>Cari Hesap</h2><div class="panel"><div class="row"><input id="crn" placeholder="Cari adı"><select id="crt"><option>Borç</option><option>Alacak</option></select><input id="cra" type="number" placeholder="Tutar"></div><br><button onclick="car()">Kaydet</button></div><div class="panel table"><table><tbody id="crt2"></tbody></table></div></section>
<section id="staff" class="hidden"><h2>Personel Takip</h2><div class="panel"><div class="row"><input id="sn" placeholder="Personel"><select id="sa"><option>Giriş</option><option>Çıkış</option></select></div><br><button onclick="staff()">Kaydet</button></div><div class="panel table"><table><tbody id="sft"></tbody></table></div></section>
</main></div>
<script>
let D=JSON.parse(localStorage.zembilden18||'{"p":[],"s":[],"k":[],"c":[],"f":[]}');const M=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n||0),N=()=>new Date().toLocaleString('tr-TR');function save(){localStorage.zembilden18=JSON.stringify(D);render()}function login(){if(u.value.trim()=='admin'&&p.value=='1234'){login.style.display='none';app.style.display='block';render()}else e.textContent='Kullanıcı adı veya şifre hatalı.'}function logout(){app.style.display='none';login.style.display='grid'}function tab(x,b){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById(x).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}function add(){if(!pn.value||+ps.value<=0)return alert('Ürün bilgilerini doldurun');D.p.push({id:Date.now(),n:pn.value,b:+pb.value,s:+ps.value,q:+pq.value});pn.value=pb.value=ps.value=pq.value='';save()}function sell(){let x=D.p.find(x=>x.id==sp.value),q=+sq.value;if(!x||x.q<q)return alert('Yetersiz stok');x.q-=q;D.s.push({id:Date.now(),d:N(),n:x.n,q,t:q*x.s,p:x.id});D.k.push({d:N(),t:'in',n:'Satış - '+x.n,a:q*x.s});save()}function ret(id){let x=D.s.find(x=>x.id==id),p=D.p.find(p=>p.id==x.p);if(p)p.q+=x.q;D.s=D.s.filter(s=>s.id!=id);let i=D.k.findIndex(k=>k.n=='Satış - '+x.n&&k.a==x.t);if(i>=0)D.k.splice(i,1);save()}function cashop(){if(+ca.value<=0)return;D.k.push({d:N(),t:ct.value,n:cn.value||'-',a:+ca.value});cn.value=ca.value='';save()}function car(){if(!crn.value||+cra.value<=0)return;D.c.push({d:N(),n:crn.value,t:crt.value,a:+cra.value});crn.value=cra.value='';save()}function staff(){if(!sn.value)return;D.f.push({d:N(),n:sn.value,a:sa.value});sn.value='';save()}function render(){let C=D.s.reduce((a,x)=>a+x.t,0),G=D.k.filter(x=>x.t=='out').reduce((a,x)=>a+x.a,0),I=D.k.filter(x=>x.t=='in').reduce((a,x)=>a+x.a,0);ciro.textContent=M(C);gider.textContent=M(G);kar.textContent=M(C-G);kasa.textContent=M(I-G);say.textContent=D.p.length;sp.innerHTML=D.p.map(x=>`<option value="${x.id}">${x.n} — ${M(x.s)} (stok ${x.q})</option>`).join('');pt.innerHTML=D.p.map(x=>`<tr><td>${x.n}</td><td>${x.q}</td><td>${M(x.b)}</td><td>${M(x.s)}</td></tr>`).join('');st.innerHTML=D.s.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${x.n}</td><td>${x.q}</td><td>${M(x.t)}</td><td><button class="danger" onclick="ret(${x.id})">İade</button></td></tr>`).join('');kt.innerHTML=D.k.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${x.t=='in'?'Gelir':'Gider'}</td><td>${x.n}</td><td>${M(x.a)}</td></tr>`).join('');crt2.innerHTML=D.c.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${x.n}</td><td>${x.t}</td><td>${M(x.a)}</td></tr>`).join('');sft.innerHTML=D.f.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${x.n}</td><td>${x.a}</td></tr>`).join('')}render();
</script></body></html>
